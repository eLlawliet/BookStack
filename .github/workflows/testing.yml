name: Git testing fix CI

on:
  push:
    branches:
      - feature-[template-work]

# ==========================================
  # CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci-testing:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bookstack-test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: bookstack-test
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
          extensions: mbstring, xml, pdo_mysql, gd, iconv, tokenizer, zip

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env
          
          # Generate the key and immediately export it to GitHub ENV variables
          APP_KEY=$(php artisan key:generate --show --no-ansi)
          echo "APP_KEY=$APP_KEY" >> $GITHUB_ENV
          
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=mysql_testing" >> .env
          echo "MYSQL_USER=bookstack-test" >> .env
          echo "MYSQL_PASSWORD=secret" >> .env

          php artisan config:clear
          php artisan cache:clear

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if mysql -h 127.0.0.1 -u bookstack-test -psecret -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL ready"
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          exit 1

      - name: Run Migrations & Seeders
        env:
          DB_CONNECTION: mysql_testing
          MYSQL_USER: bookstack-test
          MYSQL_PASSWORD: secret
        run: |
          # Run standard migrations
          php artisan migrate:fresh --seed --force
          
          # Run the dummy seeder required by the test suite
          php artisan db:seed --class=DummyContentSeeder --force

      - name: Execute Tests
        env:
          APP_ENV: testing
          APP_KEY: ${{ env.APP_KEY }}
          DB_CONNECTION: mysql_testing
          MYSQL_USER: bookstack-test
          MYSQL_PASSWORD: secret
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test --coverage-clover=coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=eLlawliet_BookStack
            -Dsonar.organization=ellawliet
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.sources=app,routes
            -Dsonar.tests=tests
