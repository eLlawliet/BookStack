name: Deploy BookStack to Azure CI/CD

on:
  push:
    branches:
      - pso

jobs:
# ==========================================
  # CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci-testing:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: bookstack-test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: bookstack-test
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql, gd, iconv, tokenizer, zip

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env

          php artisan key:generate

          echo "APP_ENV=testing" >> .env

          echo "DB_CONNECTION=mysql_testing" >> .env

          echo "MYSQL_USER=bookstack-test" >> .env
          echo "MYSQL_PASSWORD=secret" >> .env

          php artisan config:clear
          php artisan cache:clear

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if mysql -h 127.0.0.1 -u bookstack-test -psecret -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL ready"
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          exit 1

      - name: Debug Database Connection
        env:
          DB_CONNECTION: mysql_testing
          MYSQL_USER: bookstack-test
          MYSQL_PASSWORD: secret
        run: |
          php artisan tinker --execute="
          dump(config('database.connections.mysql_testing'));
          "

      - name: Run Migrations
        env:
          DB_CONNECTION: mysql_testing
          MYSQL_USER: bookstack-test
          MYSQL_PASSWORD: secret
        run: |
          php artisan migrate:fresh --seed --force

      - name: Debug PHPUnit Environment
        run: |
          php artisan tinker --execute="
          dump(env('APP_KEY'));
          dump(config('app.key'));
          dump(config('database.default'));
          dump(config('database.connections.mysql_testing'));
          "


      - name: Execute Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql_testing

          MYSQL_USER: bookstack-test
          MYSQL_PASSWORD: secret

          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: vendor/bin/phpunit --stop-on-failure
  # ==========================================
  # CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  cd-deployment:
    name: Deploy to Azure
    needs: ci-testing
    if: always() # Forces the CD job to wake up even if CI fails
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI Passed
        run: |
          if [ "${{ needs.ci-testing.result }}" != "success" ]; then
            echo "❌ ERROR: Continuous Integration (CI) tests failed!"
            echo "🛑 Aborting Continuous Deployment (CD) to protect the live server."
            exit 1
          fi
          echo "✅ CI passed! Proceeding with deployment..."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql, gd, iconv, tokenizer, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Assets
        run: |
          npm install
          npm run build

      - name: Optimize for Production
        run: composer install --no-dev --optimize-autoloader

      - name: Package Application
        run: zip -r release.zip . -x "*.git*" "tests/*" "node_modules/*"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'bookstack-project-pso'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip