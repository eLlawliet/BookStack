name: Deploy BookStack to Azure CI/CD

on:
  push:
    branches:
      - pso

jobs:
  # ==========================================
  # CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci-testing:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bookstack_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql, gd, iconv, tokenizer, zip

      - name: Install Dependencies
        run: composer install

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute Tests (Blocks CD if failed)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bookstack_test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test

  # ==========================================
  # CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  cd-deployment:
    name: Deploy to Azure
    needs: ci-testing
    if: always() # Forces the CD job to wake up even if CI fails
    runs-on: ubuntu-latest
    steps:
      # 👇 The Lab Assistant's Custom Error Gatekeeper 👇
      - name: Verify CI Passed
        run: |
          if [ "${{ needs.ci-testing.result }}" != "success" ]; then
            echo "❌ ERROR: Continuous Integration (CI) tests failed!"
            echo "🛑 Aborting Continuous Deployment (CD) to protect the live server."
            exit 1
          fi
          echo "✅ CI passed! Proceeding with deployment..."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql, gd, iconv, tokenizer, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Assets
        run: |
          npm install
          npm run build

      - name: Optimize for Production
        run: composer install --no-dev --optimize-autoloader

      - name: Package Application
        run: zip -r release.zip . -x "*.git*" "tests/*" "node_modules/*"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'bookstack-project-pso'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip