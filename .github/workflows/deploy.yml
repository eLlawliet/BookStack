name: Deploy BookStack to Azure CI/CD

on:
  push:
    branches:
      - pso

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql, gd, iconv, tokenizer, zip

      - name: Install PHP Dependencies (CI)
        run: composer install --no-dev --optimize-autoloader

      - name: Package Application for Deployment
        run: zip -r release.zip . -x "*.git*" "tests/*" "node_modules/*"

      - name: Deploy to Azure App Service (CD)
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'bookstack-project-pso'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip