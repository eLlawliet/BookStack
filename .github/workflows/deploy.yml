name: Deploy BookStack to Azure CI/CD

on:
  push:
    branches:
      - pso

jobs:
# ==========================================
  # CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci-testing:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: bookstack-test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: bookstack-test
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql, gd, iconv, tokenizer, zip

      - name: Install Dependencies
        run: composer install

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 3306; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 1
          done
          exit 1

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bookstack-test
          DB_USERNAME: bookstack-test
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Clear Laravel Cache (safety step)
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear

      - name: Hard Reset Laravel Runtime
        run: |
          php artisan optimize:clear
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear

      - name: Execute Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bookstack-test
          DB_USERNAME: bookstack-test
          DB_PASSWORD: secret
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test --filter=ExampleTest
  # ==========================================
  # CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  cd-deployment:
    name: Deploy to Azure
    needs: ci-testing
    if: always() # Forces the CD job to wake up even if CI fails
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI Passed
        run: |
          if [ "${{ needs.ci-testing.result }}" != "success" ]; then
            echo "❌ ERROR: Continuous Integration (CI) tests failed!"
            echo "🛑 Aborting Continuous Deployment (CD) to protect the live server."
            exit 1
          fi
          echo "✅ CI passed! Proceeding with deployment..."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql, gd, iconv, tokenizer, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Assets
        run: |
          npm install
          npm run build

      - name: Optimize for Production
        run: composer install --no-dev --optimize-autoloader

      - name: Package Application
        run: zip -r release.zip . -x "*.git*" "tests/*" "node_modules/*"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'bookstack-project-pso'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip